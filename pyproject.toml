[project]
name = "vyne"
version = "0.1.0a1"
description = "Python-authored native Android UI framework."
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
vyne = "vyne.cli.main:main"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/vyne-material"]

[tool.setuptools.packages.find]
where = ["packages/vyne/src"]

[tool.setuptools.package-data]
vyne = ["py.typed", "*.pyi", "cli/templates/*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.13",
    "vyne-material",
]

[tool.uv.sources]
vyne-material = { workspace = true }
