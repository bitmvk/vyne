[project]
name = "vyne"
version = "0.1.0a1"
description = "Python-authored native Android UI framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tomlkit>=0.12", "packaging>=24"]

[project.scripts]
vyne = "vyne.cli.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["packages/vyne/src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
